services:

  php:
    build:
      context: ./php
      dockerfile: Dockerfile

    container_name: php83

    volumes:
      - ./:/var/www

    working_dir: /var/www

  nginx:

    image: nginx:latest

    container_name: nginx

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php
  
  mysql:
    image: mysql:8.4

    container_name: mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
  
    ports:
      - "3306:3306"
    volumes:
     - mysql_data:/var/lib/mysql

  phpmyadmin:
      image: phpmyadmin:latest
      container_name: phpmyadmin
      restart: unless-stopped
      ports:
        - "8081:80"
      environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
      depends_on:
        - mysql 

  
volumes:
  mysql_data:
